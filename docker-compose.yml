# SentinelAI — local development stack.
#
# Profiles keep the footprint small; nothing starts unless you ask for it.
#   core          PostgreSQL only. Everything Phase 1 needs.
#   samples       The 5 sample microservices (added in Phase 1, exercised in Phase 2).
#   observability OTel Collector, Loki, Prometheus, Jaeger, Grafana (Phase 2).
#   mcp           The MCP servers (Phase 4).
#
#   docker compose --profile core up -d
#   docker compose --profile core --profile samples up -d
#
# Memory limits are set deliberately: the whole stack has to fit on a 16 GB laptop.

name: sentinel-ai

x-samples-common: &samples-common
  profiles: [samples, all]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &samples-env
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinel};Username=${POSTGRES_USER:-sentinel};Password=${POSTGRES_PASSWORD:-sentinel_dev_pw};Maximum Pool Size=200"
    # gRPC on 4317, which is the OTel .NET SDK's default protocol. Set SAMPLES_OTLP_ENDPOINT to
    # an empty value to run the samples without the observability profile: the exporter is then
    # disabled rather than retrying forever against a collector that is not there.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${SAMPLES_OTLP_ENDPOINT-http://otel-collector:4317}
  mem_limit: 320m
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
    interval: 15s
    timeout: 3s
    retries: 5
    start_period: 20s

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sentinel-postgres
    profiles: [core, all]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_pw}
      # Deterministic collation so ORDER BY behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      # pg_stat_statements is not optional: database-mcp's get_slow_queries reads it,
      # and scenarios 2 and 4 are unsolvable without it.
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=5000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      # Anything slower than 200ms lands in the log, which gives logs-mcp a second
      # independent signal for the slow-query scenarios.
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "log_lock_waits=on"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------- samples ----
  gateway:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: gateway/Dockerfile
    container_name: sentinel-gateway
    environment:
      <<: *samples-env
      Services__Users: http://users:8080
      Services__Orders: http://orders:8080
      Services__Payments: http://payments:8080
      Services__Notifications: http://notifications:8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      orders:
        condition: service_started

  users:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: users/Dockerfile
    container_name: sentinel-users
    environment:
      <<: *samples-env
      Services__Orders: http://orders:8080
    ports:
      - "${USERS_PORT:-8081}:8080"

  orders:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: orders/Dockerfile
    container_name: sentinel-orders
    environment:
      <<: *samples-env
      Services__Payments: http://payments:8080
    ports:
      - "${ORDERS_PORT:-8082}:8080"

  payments:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: payments/Dockerfile
    container_name: sentinel-payments
    environment:
      <<: *samples-env
      Services__Notifications: http://notifications:8080
    ports:
      - "${PAYMENTS_PORT:-8083}:8080"

  notifications:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: notifications/Dockerfile
    container_name: sentinel-notifications
    ports:
      - "${NOTIFICATIONS_PORT:-8084}:8080"

  # ------------------------------------------------------- observability ----
  # One ingress for every signal. Services speak OTLP to the collector and nothing else, so
  # Loki, Prometheus and Jaeger are swappable without touching a service.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: sentinel-otel-collector
    profiles: [observability, all]
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./infrastructure/otel-collector/config.yml:/etc/otel/config.yml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - loki
      - jaeger
    mem_limit: 320m

  loki:
    image: grafana/loki:3.3.2
    container_name: sentinel-loki
    profiles: [observability, all]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "0:0"
    volumes:
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sentinel-prometheus
    profiles: [observability, all]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Matches Loki's retention: an investigation never looks further back than this.
      - "--storage.tsdb.retention.time=48h"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: sentinel-jaeger
    profiles: [observability, all]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # In-memory storage: traces live as long as the container, which is longer than any
      # investigation window and costs no disk.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: sentinel-grafana
    profiles: [observability, all]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Local single-user stack; the sign-in page adds nothing but a click.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    mem_limit: 384m

volumes:
  postgres-data:
    name: sentinel-postgres-data

  loki-data:
    name: sentinel-loki-data

  prometheus-data:
    name: sentinel-prometheus-data

  grafana-data:
    name: sentinel-grafana-data

networks:
  default:
    name: sentinel-net
