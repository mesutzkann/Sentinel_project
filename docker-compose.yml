# SentinelAI — local development stack.
#
# Profiles keep the footprint small; nothing starts unless you ask for it.
#   core          PostgreSQL only. Everything Phase 1 needs.
#   samples       The 5 sample microservices (added in Phase 1, exercised in Phase 2).
#   observability OTel Collector, Loki, Prometheus, Jaeger, Grafana (Phase 2).
#   mcp           The six read-only MCP servers (Phase 4).
#
#   docker compose --profile core up -d
#   docker compose --profile core --profile samples up -d
#
# Memory limits are set deliberately: the whole stack has to fit on a 16 GB laptop.
#
# Every port is published to 127.0.0.1 rather than 0.0.0.0. The difference matters: Grafana
# allows anonymous viewers, and Prometheus, Loki and Jaeger have no authentication at all, so
# publishing on every interface would hand anyone on the same network the telemetry of the whole
# stack — and, through PostgreSQL, its data. Loopback keeps a development stack on the machine
# it is being developed on.

name: sentinel-ai

x-samples-common: &samples-common
  profiles: [samples, all]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &samples-env
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinel};Username=${POSTGRES_USER:-sentinel};Password=${POSTGRES_PASSWORD:-sentinel_dev_pw};Maximum Pool Size=200"
    # gRPC on 4317, which is the OTel .NET SDK's default protocol. Set SAMPLES_OTLP_ENDPOINT to
    # an empty value to run the samples without the observability profile: the exporter is then
    # disabled rather than retrying forever against a collector that is not there.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${SAMPLES_OTLP_ENDPOINT-http://otel-collector:4317}
  mem_limit: 320m
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
    interval: 15s
    timeout: 3s
    retries: 5
    start_period: 20s

x-mcp-common: &mcp-common
  profiles: [mcp, all]
  restart: unless-stopped
  build:
    context: ./mcp-servers
  environment: &mcp-env
    LOKI_URL: http://loki:3100
    PROMETHEUS_URL: http://prometheus:9090
    JAEGER_URL: http://jaeger:16686
    POSTGRES_DSN: "postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_dev_pw}@postgres:5432/${POSTGRES_DB:-sentinel}"
    REPO_ROOT: /repo
    # Shared with the backend that issues approvals and the AI service that verifies them first.
    # Empty here means every destructive tool refuses every call, which is the right default.
    APPROVAL_SECRET: "${APPROVAL_SECRET:-}"
    CONTAINER_PREFIX: "${CONTAINER_PREFIX:-sentinel-}"
  volumes:
    # Read-only on purpose. In Phase 4 nothing writes to the repository, and the destructive
    # tools that will in Phase 10 are a deliberate, separately-mounted decision rather than
    # something these servers can do by accident.
    - .:/repo:ro
  mem_limit: 256m

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sentinel-postgres
    profiles: [core, all]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_pw}
      # Deterministic collation so ORDER BY behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      # pg_stat_statements is not optional: database-mcp's get_slow_queries reads it,
      # and scenarios 2 and 4 are unsolvable without it.
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=5000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      # Anything slower than 200ms lands in the log, which gives logs-mcp a second
      # independent signal for the slow-query scenarios.
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "log_lock_waits=on"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------- samples ----
  gateway:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: gateway/Dockerfile
    container_name: sentinel-gateway
    environment:
      <<: *samples-env
      Services__Users: http://users:8080
      Services__Orders: http://orders:8080
      Services__Payments: http://payments:8080
      Services__Notifications: http://notifications:8080
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      orders:
        condition: service_started

  users:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: users/Dockerfile
    container_name: sentinel-users
    environment:
      <<: *samples-env
      Services__Orders: http://orders:8080
    ports:
      - "127.0.0.1:${USERS_PORT:-8081}:8080"

  orders:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: orders/Dockerfile
    container_name: sentinel-orders
    environment:
      <<: *samples-env
      Services__Payments: http://payments:8080
    ports:
      - "127.0.0.1:${ORDERS_PORT:-8082}:8080"

  payments:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: payments/Dockerfile
    container_name: sentinel-payments
    environment:
      <<: *samples-env
      Services__Notifications: http://notifications:8080
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-8083}:8080"

  notifications:
    <<: *samples-common
    build:
      context: ./sample-services
      dockerfile: notifications/Dockerfile
    container_name: sentinel-notifications
    environment:
      <<: *samples-env
      Services__DeliveryProvider: http://delivery-provider:8080
    ports:
      - "127.0.0.1:${NOTIFICATIONS_PORT:-8084}:8080"

  # The third party notifications delivers through, and the only process here that is *not* part
  # of the system being observed. It exports no telemetry on purpose: chaos scenario 12 is
  # recognised by a failure that terminates at an external span, and an instrumented provider
  # would appear in Jaeger as a sixth service and look like an internal dependency instead.
  #
  # No database, so it does not depend on postgres and does not inherit samples-common.
  delivery-provider:
    profiles: [samples, all]
    restart: unless-stopped
    build:
      context: ./sample-services
      dockerfile: delivery-provider/Dockerfile
    container_name: sentinel-delivery-provider
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "127.0.0.1:${DELIVERY_PROVIDER_PORT:-8085}:8080"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------- observability ----
  # One ingress for every signal. Services speak OTLP to the collector and nothing else, so
  # Loki, Prometheus and Jaeger are swappable without touching a service.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: sentinel-otel-collector
    profiles: [observability, all]
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./infrastructure/otel-collector/config.yml:/etc/otel/config.yml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - loki
      - jaeger
    mem_limit: 320m

  loki:
    image: grafana/loki:3.3.2
    container_name: sentinel-loki
    profiles: [observability, all]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "0:0"
    volumes:
      - ./infrastructure/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sentinel-prometheus
    profiles: [observability, all]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Matches Loki's retention: an investigation never looks further back than this.
      - "--storage.tsdb.retention.time=48h"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: sentinel-jaeger
    profiles: [observability, all]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # In-memory storage: traces live as long as the container, which is longer than any
      # investigation window and costs no disk.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: sentinel-grafana
    profiles: [observability, all]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Local single-user stack; the sign-in page adds nothing but a click.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    mem_limit: 384m

  # ------------------------------------------------------------------- mcp ----
  # Six servers from one image, differing only in which tools they register. They are the
  # agent's entire read access to the running system: it reaches nothing except through these.
  #
  # git-mcp and source-code-mcp mount the repository read-only. That mount is why the agent can
  # answer "what changed" and "show me that line" — and why it is :ro.

  logs-mcp:
    <<: *mcp-common
    container_name: sentinel-logs-mcp
    command: ["python", "-m", "logs_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7001"
    ports:
      - "127.0.0.1:${LOGS_MCP_PORT:-7001}:7001"

  metrics-mcp:
    <<: *mcp-common
    container_name: sentinel-metrics-mcp
    command: ["python", "-m", "metrics_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7002"
    ports:
      - "127.0.0.1:${METRICS_MCP_PORT:-7002}:7002"

  traces-mcp:
    <<: *mcp-common
    container_name: sentinel-traces-mcp
    command: ["python", "-m", "traces_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7003"
    ports:
      - "127.0.0.1:${TRACES_MCP_PORT:-7003}:7003"

  database-mcp:
    <<: *mcp-common
    container_name: sentinel-database-mcp
    command: ["python", "-m", "database_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7004"
    ports:
      - "127.0.0.1:${DATABASE_MCP_PORT:-7004}:7004"

  git-mcp:
    <<: *mcp-common
    container_name: sentinel-git-mcp
    command: ["python", "-m", "git_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7005"
    ports:
      - "127.0.0.1:${GIT_MCP_PORT:-7005}:7005"

  source-code-mcp:
    <<: *mcp-common
    container_name: sentinel-source-code-mcp
    command: ["python", "-m", "source_code_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7006"
    ports:
      - "127.0.0.1:${SOURCE_CODE_MCP_PORT:-7006}:7006"

  # The Docker socket, behind a filter. This is the only container in the project that holds it,
  # and it is not the one that makes decisions: it exposes the container endpoints over TCP on an
  # internal network and refuses everything else — no images, no volumes, no networks, and no
  # `exec`, which is the endpoint that turns "restart a container" into "run anything as root on
  # the host".
  #
  # The alternative was mounting the socket into docker-mcp and granting it group 0, because on
  # Docker Desktop the socket is root:root 660. That works and it hands a tool server root on the
  # host's Docker for the sake of four endpoints.
  docker-proxy:
    profiles: [mcp, all]
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: sentinel-docker-proxy
    restart: unless-stopped
    environment:
      # What docker-mcp needs: list, inspect, stats, logs, restart, and recreate with a new
      # environment. POST is what makes the last two possible and is the reason the rest of this
      # list is explicit.
      CONTAINERS: "1"
      POST: "1"
      # Everything else, said out loud rather than left to the image's defaults.
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      SERVICES: "0"
      SWARM: "0"
      SECRETS: "0"
      CONFIGS: "0"
      NODES: "0"
      TASKS: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No published port. Only the compose network reaches it, which is the point.
    expose:
      - "2375"
    mem_limit: 64m

  # The only server that can change the running system: it restarts containers and rewrites their
  # environment, both behind an approval token that names the container — see
  # mcp-servers/docker_mcp/server.py. It reaches Docker through the proxy above rather than
  # through the socket, so the worst this container can do is bounded by what the proxy passes.
  docker-mcp:
    <<: *mcp-common
    container_name: sentinel-docker-mcp
    command: ["python", "-m", "docker_mcp.server"]
    depends_on:
      - docker-proxy
    environment:
      <<: *mcp-env
      PORT: "7007"
      DOCKER_HOST: http://docker-proxy:2375
    ports:
      - "127.0.0.1:${DOCKER_MCP_PORT:-7007}:7007"

  # The only server that generates traffic rather than reading what traffic left behind: it
  # makes real requests through the estate to find out whether a fix worked. Its workflow check
  # writes an order row and is approval-gated for exactly that reason.
  testing-mcp:
    <<: *mcp-common
    container_name: sentinel-testing-mcp
    command: ["python", "-m", "testing_mcp.server"]
    environment:
      <<: *mcp-env
      PORT: "7008"
    ports:
      - "127.0.0.1:${TESTING_MCP_PORT:-7008}:7008"

volumes:
  postgres-data:
    name: sentinel-postgres-data

  loki-data:
    name: sentinel-loki-data

  prometheus-data:
    name: sentinel-prometheus-data

  grafana-data:
    name: sentinel-grafana-data

networks:
  default:
    name: sentinel-net
