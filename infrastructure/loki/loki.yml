# Single-binary Loki. Everything is local filesystem storage: this is a development stack, and
# ADR-0001 explains why Loki rather than OpenSearch.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion: attributes that are not promoted to labels are stored as
  # structured metadata, which is how the exception type and stack trace survive.
  allow_structured_metadata: true
  volume_enabled: true

  # Investigations look at minutes-to-hours windows, so two days is generous and keeps the
  # volume small enough to sit alongside everything else.
  retention_period: 48h

  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

  # A chaos scenario can produce a burst of near-identical lines; without this the burst is
  # rejected rather than recorded, and the burst is exactly the evidence.
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
