[project]
name = "sentinel-ai-service"
version = "0.1.0"
description = "SentinelAI reasoning service: local LLM, hybrid RAG, and the investigation agent."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
# The cross-encoder reranker, which Ollama cannot serve: ~2.5 GB of PyTorch plus a 2.2 GB model.
# Optional because retrieval answers without it and the machine this is developed on is already
# holding a language model. See docs/adr/0005-reranker-runs-in-process.md.
rerank = [
    "sentence-transformers>=3.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "llm",
    "llm.prompts",
    "reporting",
    "mcp_client",
    "rag",
    "routing",
    "agents",
    "evaluation",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
