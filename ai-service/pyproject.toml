[project]
name = "sentinel-ai-service"
version = "0.1.0"
description = "SentinelAI reasoning service: local LLM, hybrid RAG, and the investigation agent."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Self-observability (Phase 11). Core rather than an extra: the hot path imports only
    # `opentelemetry-api`, which is inert without a provider, and the SDK is a couple of MB that
    # has to already be there for OTEL_EXPORTER_OTLP_ENDPOINT to be the only thing a demo turns
    # on. An extra would make the dashboard depend on somebody having read a second install line.
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[project.optional-dependencies]
# The cross-encoder reranker, which Ollama cannot serve: ~2.5 GB of PyTorch plus a 2.2 GB model.
# Optional because retrieval answers without it and the machine this is developed on is already
# holding a language model. See docs/adr/0005-reranker-runs-in-process.md.
rerank = [
    "sentence-transformers>=3.3.0",
]
# Fine-tuning the router (Phase 8). Heavy and optional, like the reranker: nothing the running
# service imports comes from here, and `ai-service/training/` is the only thing that uses it.
# torch comes with the `rerank` extra; a CUDA build has to be installed separately, which the
# README covers.
train = [
    "peft>=0.14.0",
    "trl>=0.13.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "llm",
    "llm.prompts",
    "reporting",
    "observability",
    "mcp_client",
    "rag",
    "routing",
    "agents",
    "agents.nodes",
    "training",
    "evaluation",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
