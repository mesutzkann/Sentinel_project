; Alembic owns the `rag` schema, as the database bootstrap in
; infrastructure/postgres/init/01-extensions-and-schemas.sql says it does.
;
; The connection URL is not here. It is built in migrations/env.py from the same POSTGRES_*
; variables in .env that the backend, the samples and the AI service read, so there is one
; password in this repository rather than one plus a copy that goes stale.
;
;   cd ai-service
;   alembic upgrade head          apply
;   alembic revision --autogenerate -m "..."   after changing rag/schema.py
;   alembic downgrade -1          undo the last one

[alembic]
script_location = migrations
prepend_sys_path = .

# Revisions are named 0001_..., 0002_..., in application order. The default template is a random
# hex id, which sorts by nothing and makes the version directory unreadable at a glance.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
